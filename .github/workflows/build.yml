name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Test (including a simulated Smart Shooter)
        run: python -m unittest discover -s tests -t . -v
        env:
          REQUIRE_INTEGRATION: "1"

      - name: Build StudentPhotoTagger.exe
        run: pyinstaller --noconfirm --onefile --windowed --name StudentPhotoTagger run.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: StudentPhotoTagger
          path: dist/StudentPhotoTagger.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import app; print(app.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Student Photo Tagger ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Download **StudentPhotoTagger.exe** below and double-click it (no install needed).
            First run: if Windows says "Windows protected your PC", click More info -> Run anyway.
            Setup guide: see the README on the repository's front page.
          files: |
            dist/StudentPhotoTagger.exe
            sample_students.csv
